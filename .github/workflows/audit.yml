name: audit

on:
  push:
    branches: [main]
    paths:
      - core/package.json
      - core/package-lock.json
      - .github/workflows/audit.yml
  pull_request:
    branches: [main]
    paths:
      - core/package.json
      - core/package-lock.json
      - .github/workflows/audit.yml
  schedule:
    # Nightly, so a freshly disclosed advisory surfaces without a push.
    - cron: "14 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm --prefix core ci

      # High and critical only: the extension ships no server, so a moderate
      # advisory in a build-time dependency should not page anyone at 03:14.
      - name: Audit
        run: npm --prefix core audit --audit-level=high
