version: 2
updates:
  # The npm project lives in core/, not the repository root.
  - package-ecosystem: npm
    directory: /core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR per ecosystem cluster keeps the check gate from running eight
      # times for what is effectively a single upgrade.
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "vitest"
          - "knip"
        update-types:
          - minor
          - patch
      # Kept out of dev-tooling: a typings bump can demand real code changes
      # (@types/chrome 0.0.x to 0.2.x did), and grouping it would hold three
      # working updates hostage to one that needs a migration.
      types:
        patterns:
          - "@types/*"
        # The React typings belong with react/react-dom below, not here: a
        # dependency joins the first group it matches, and splitting them off
        # would recreate the peer-resolution deadlock.
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      # Majors included on purpose: react and react-dom must move together, and
      # their @types follow the same major. Split across PRs they each fail
      # peer resolution and none of them can land.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
      build:
        patterns:
          - "vite"
          - "@crxjs/*"
        update-types:
          - minor
          - patch

    ignore:
      # TypeScript 7 is not installable here yet: typescript-eslint pins
      # ts-api-utils, whose peer range stops at 5.x, so npm ci fails before
      # anything is even compiled. Drop this once typescript-eslint ships
      # TypeScript 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
