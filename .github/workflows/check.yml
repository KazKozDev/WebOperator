name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms even when one fails: the point of the matrix is
      # to tell macOS-only breakage apart from Linux-only breakage.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version: .nvmrc
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: core/package-lock.json

      # Ubuntu runners ship shellcheck; macOS runners do not.
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install dependencies
        run: npm --prefix core ci

      # Fixture evals, bridge smoke test, typecheck, lint, unit tests,
      # dead-code scan, shellcheck and the production build.
      - name: Run the full gate
        run: ./scripts/check.sh

      # Once per matrix, not twice: the numbers are platform-independent, and
      # the thresholds in vite.config.ts fail the job on a coverage regression.
      - name: Coverage
        if: runner.os == 'Linux'
        run: npm --prefix core run test:coverage

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: core/coverage/lcov.info
          retention-days: 14
